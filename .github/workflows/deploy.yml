name: Cortex AI deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      repair_frontend:
        description: Re-enable and verify the existing frontend CloudFront distribution
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECS_CLUSTER: backend
  GATEWAY_SERVICE: gateway-service
  AUTH_SERVICE: auth-service
  CHAT_SERVICE: chat-service
  AGENT_SERVICE: agent-service
  BILLING_SERVICE: billing-service

jobs:
  deploy-backend:
    if: >-
      (github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[repair-frontend]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.repair_frontend != true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY" \
            > backend/services/auth/serviceAccountKey.json

      - name: Build and push backend images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 --push \
            -f backend/gateway/Dockerfile \
            -t "$ECR_REGISTRY/gateway:latest" backend

          docker buildx build --platform linux/arm64 --push \
            -f backend/services/auth/Dockerfile \
            -t "$ECR_REGISTRY/auth-service:latest" backend

          docker buildx build --platform linux/arm64 --push \
            -f backend/services/chat/Dockerfile \
            -t "$ECR_REGISTRY/chat-service:latest" backend

          docker buildx build --platform linux/arm64 --push \
            -f backend/services/agent/Dockerfile \
            -t "$ECR_REGISTRY/agent-service:latest" backend

          docker buildx build --platform linux/arm64 --push \
            -f backend/services/billing/Dockerfile \
            -t "$ECR_REGISTRY/billing-service:latest" backend

      - name: Redeploy ECS services
        run: |
          for service in \
            "$GATEWAY_SERVICE" \
            "$AUTH_SERVICE" \
            "$CHAT_SERVICE" \
            "$AGENT_SERVICE" \
            "$BILLING_SERVICE"
          do
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$service" \
              --force-new-deployment
          done

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify and enable frontend CloudFront distribution
        id: frontend-cloudfront
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          config_file="$(mktemp)"
          enabled_config_file="$(mktemp)"

          aws cloudfront get-distribution-config \
            --id "$DISTRIBUTION_ID" \
            --output json > "$config_file"

          etag="$(jq -r '.ETag' "$config_file")"
          enabled="$(jq -r '.DistributionConfig.Enabled' "$config_file")"

          if [ "$enabled" != "true" ]; then
            jq '.DistributionConfig.Enabled = true | .DistributionConfig' \
              "$config_file" > "$enabled_config_file"

            aws cloudfront update-distribution \
              --id "$DISTRIBUTION_ID" \
              --if-match "$etag" \
              --distribution-config "file://$enabled_config_file"
          fi

          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"

          domain_name="$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION_ID" \
            --query 'Distribution.DomainName' \
            --output text)"

          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"
          echo "domain_name=$domain_name" >> "$GITHUB_OUTPUT"

      - name: Upload frontend to S3
        run: aws s3 sync frontend/dist "s3://${{ secrets.FRONTEND_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.frontend-cloudfront.outputs.distribution_id }}" \
            --paths "/*"

      - name: Verify frontend is reachable
        env:
          DOMAIN_NAME: ${{ steps.frontend-cloudfront.outputs.domain_name }}
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error \
              "https://$DOMAIN_NAME/" --output /dev/null
            then
              echo "Frontend is live at https://$DOMAIN_NAME/"
              exit 0
            fi
            sleep 10
          done

          echo "Frontend did not become reachable after 3 minutes."
          exit 1

  repair-frontend:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.repair_frontend == true) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[repair-frontend]'))
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Re-enable frontend CloudFront distribution
        id: repair-cloudfront
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          config_file="$(mktemp)"
          enabled_config_file="$(mktemp)"

          aws cloudfront get-distribution-config \
            --id "$DISTRIBUTION_ID" \
            --output json > "$config_file"

          etag="$(jq -r '.ETag' "$config_file")"
          enabled="$(jq -r '.DistributionConfig.Enabled' "$config_file")"

          if [ "$enabled" != "true" ]; then
            jq '.DistributionConfig.Enabled = true | .DistributionConfig' \
              "$config_file" > "$enabled_config_file"

            aws cloudfront update-distribution \
              --id "$DISTRIBUTION_ID" \
              --if-match "$etag" \
              --distribution-config "file://$enabled_config_file"
          fi

          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"

          domain_name="$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION_ID" \
            --query 'Distribution.DomainName' \
            --output text)"

          echo "domain_name=$domain_name" >> "$GITHUB_OUTPUT"

      - name: Verify frontend is reachable
        env:
          DOMAIN_NAME: ${{ steps.repair-cloudfront.outputs.domain_name }}
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error \
              "https://$DOMAIN_NAME/" --output /dev/null
            then
              echo "Frontend is live at https://$DOMAIN_NAME/"
              exit 0
            fi
            sleep 10
          done

          echo "Frontend did not become reachable after 3 minutes."
          exit 1
